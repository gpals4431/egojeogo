// API Gateway - 모든 마이크로서비스의 진입점

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // Common 모듈 의존성 (Spring MVC 제외)
    implementation(project(':common')) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    
    // Spring Cloud Gateway
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway:4.1.0'
    
    // Spring Boot Actuator (헬스체크용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // WebFlux (Gateway는 Reactive 기반)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootRun {
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dconsole.encoding=UTF-8']
}
